# The harness's names and folders (plan: reports/2026-10-26_plan_overnight-claude.md, section 3). The scripts in
# fleet/ source this file through fleet/fleet.sh, so keep to plain NAME=value lines; $HOME is the only variable used.
FLEET_PREFIX=commute                         # agents are named commute-<role>
FLEET_SESSION=commute                        # the tmux session the agents run in
FLEET_AGENTS=$HOME/commute-agents            # one clone per agent: <agents>/<role>/
FLEET_DATA=$HOME/commute-data                # artifacts, large results, venvs, roster, handoff notes, logs
FLEET_SECRETS=$HOME/.config/commute/secrets.env  # mode 600; sourced into each agent's command only
