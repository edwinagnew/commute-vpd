[project]
name = "commute"
version = "0.1.0"
description = "Can a small post-training gradient update be commuted past a VPD parameter decomposition?"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    # Goodfire's param-decomp, pinned to commit 74146b5 (head of the vpd-paper branch on 2026-10-14).
    # A read-only clone for reference lives at ../param-decomp (outside this repo).
    "param-decomp @ git+https://github.com/goodfire-ai/param-decomp.git@74146b555f3eb3cd2bc639c3789fd3b7a099094a",
    # Pinned to the authors' lockfile at that commit (as vpd-audit does); wandb >= 0.30 breaks
    # their wandb_utils import.
    "torch==2.8.0",
    "pydantic==2.11.10",
    "wandb==0.23.1",
    "transformers==4.57.3",
    "datasets==4.4.2",
    "huggingface_hub==0.36.0",
    "numpy==2.4.0",
    # Ours.
    "einops==0.8.1",
    "pyyaml==6.0.3",
    "matplotlib==3.10.7",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "tqdm==4.67.1",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pyright>=1.1.414",
    "ruff>=0.17.0",
    # Jupyter kernel + server for notebooks on the MATS cluster (see cluster/README.md).
    "ipykernel==7.4.0",
    "jupyter-server==2.21.1",
]
# Which torch build: `cpu` on the laptop (default; no GPU there, saves ~4.6 GB of CUDA wheels), `gpu` on the
# cluster (`uv sync --locked --no-default-groups --group dev --group gpu`, see cluster/setup.sbatch). `gpu` is
# the plain PyPI wheel (CUDA 12.8), the same build the cluster venv had before the split.
cpu = ["torch==2.8.0", "torchvision==0.23.0"]  # torchvision: param-decomp pulls it in; the PyPI wheel is CUDA-built
gpu = ["torch==2.8.0", "torchvision==0.23.0"]

[tool.uv]
default-groups = ["dev", "cpu"]
conflicts = [[{ group = "cpu" }, { group = "gpu" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", group = "cpu" }]
torchvision = [{ index = "pytorch-cpu", group = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
